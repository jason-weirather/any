name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.13", "3.14"]
    env:
      ANY_REQUIRE_SANDBOX: "1"
      ANY_REQUIRE_INFERENCE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Linux sandbox dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap libseccomp2
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: any --doctor
      - run: pytest
      - run: python -m pip wheel --no-deps --wheel-dir dist .
